<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENNO HAAR GLB v31</title><style>body{background:#17131e;color:white;font:18px system-ui;padding:36px 20px;max-width:640px;margin:auto}button{background:#8700ec;color:#fff;border:0;border-radius:12px;padding:18px;font:inherit}button:disabled{opacity:.5}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"}}</script></head><body><h1>ENNO HAAR v31</h1><p>Original-Look wie v28, nur die letzten A A R horizontal verbreitert.</p><button id="download" disabled>Modell wird geladen …</button><p id="status"></p><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{GLTFExporter}from'three/addons/exporters/GLTFExporter.js';
const button=document.querySelector('button'),status=document.querySelector('#status');let model;
try{model=(await new GLTFLoader().loadAsync('./enno6_test.glb')).scene;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),start=bounds.min.x+(bounds.max.x-bounds.min.x)*.67, inverse=new THREE.Matrix4().copy(model.matrixWorld).invert();model.traverse(part=>{if(!part.isMesh||!part.geometry?.attributes?.position)return;part.geometry=part.geometry.clone();const p=part.geometry.attributes.position,to=new THREE.Matrix4().copy(inverse).multiply(part.matrixWorld),back=new THREE.Matrix4().copy(part.matrixWorld).invert().multiply(model.matrixWorld),v=new THREE.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(to);if(v.x>start)v.x=start+(v.x-start)*1.30;v.applyMatrix4(back);p.setXYZ(i,v.x,v.y,v.z)}p.needsUpdate=true;part.geometry.computeBoundingBox();part.geometry.computeBoundingSphere();part.geometry.computeVertexNormals()});button.disabled=false;button.textContent='Fertiges GLB herunterladen';status.textContent='Bereit.'}catch(e){status.textContent=e.message}
button.onclick=()=>{status.textContent='Exportiere …';new GLTFExporter().parse(model,result=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([result],{type:'model/gltf-binary'}));a.download='enno_haar_v31_AAR_breiter.glb';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);status.textContent='Datei gespeichert.'},err=>status.textContent=err.message,{binary:true})};
</script></body></html>
