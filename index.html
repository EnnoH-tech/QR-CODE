<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ENNO HAAR WASN'T HERE</title>

<meta property="og:title" content="ENNO HAAR WASN'T HERE">
<meta name="apple-mobile-web-app-title" content="ENNO HAAR WASN'T HERE">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

a-scene{
  width:100%;
  height:100%;
}

.mindar-ui-loading,
.mindar-ui-scanning{
  display:none !important;
}
</style>
</head>

<body>

<a-scene
  embedded
  color-space="sRGB"
  renderer="alpha:true; antialias:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"

  mindar-image="
    imageTargetSrc: ./targets2.mind;
    autoStart:true;
    uiLoading:false;
    uiScanning:false;
    filterMinCF:0.0005;
    filterBeta:0.02;
  "
>

<a-assets>
  <a-asset-item
    id="model"
    src="./enno6_test.glb">
  </a-asset-item>
</a-assets>

<a-camera
  position="0 0 0"
  look-controls="enabled:false">
</a-camera>

<a-entity
  light="type:ambient; intensity:1.6">
</a-entity>

<a-entity
  light="type:directional; intensity:1.2"
  position="1 2 1">
</a-entity>

<a-entity
  id="target"
  mindar-image-target="targetIndex:0">

  <a-entity
    id="text"
    gltf-model="#model"
    visible="false"

    position="-0.25 0 0.05"

    rotation="0 0 0"

    scale="1.6 1.6 1.6">
  </a-entity>

</a-entity>

</a-scene>

<script>

const target = document.querySelector("#target");
const text = document.querySelector("#text");

target.addEventListener("targetFound", () => {
  text.setAttribute("visible", true);
});

target.addEventListener("targetLost", () => {
  text.setAttribute("visible", false);
});

</script>

</body>
</html>
