<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ENNO HAAR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: #000;
}

#video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 0;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 1;
  background: transparent !important;
}
</style>
</head>

<body>

<video
  id="video"
  playsinline
  webkit-playsinline
  muted>
</video>

<a-scene
  embedded
  renderer="alpha:true; antialias:true; colorManagement:true"
  background="transparent:true"
  vr-mode-ui="enabled:false"
>

  <a-assets>
    <a-asset-item
      id="model"
      src="./enno6_test.glb">
    </a-asset-item>
  </a-assets>

  <a-entity
    light="type: ambient; intensity: 1.8">
  </a-entity>

  <a-entity
    light="type: directional; intensity: 1.2"
    position="1 2 1">
  </a-entity>

 <a-entity
  id="text"
  gltf-model="#model"
  position="-3.8 -20 -12"
  rotation="0 16 0"
  scale="30 30 30">
</a-entity>
  <a-camera
    position="0 0 0"
    look-controls="enabled:true"
    wasd-controls="enabled:false">
  </a-camera>

</a-scene>

<script>

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      }
    });

    const video = document.getElementById("video");

    video.srcObject = stream;

    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    await video.play();

  } catch (err) {

    console.error(err);

  }

}

window.addEventListener("load", startCamera);

</script>

</body>
</html>
