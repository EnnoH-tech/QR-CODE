<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ENNO HAAR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: #000;
}

#video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 0;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 1;
  background: transparent !important;
}
</style>
</head>

<body>

<video
  id="video"
  playsinline
  webkit-playsinline
  muted>
</video>

<a-scene
  embedded
  renderer="alpha:true; antialias:true; colorManagement:true"
  background="transparent:true"
  vr-mode-ui="enabled:false"
>

  <a-assets>
    <a-asset-item
      id="model"
      src="./enno6_test.glb">
    </a-asset-item>
  </a-assets>

  <a-entity
    light="type: ambient; intensity: 0.28">
  </a-entity>

  <a-entity
    light="type: directional; intensity: 2.8"
    position="-2 4 3">
  </a-entity>

  <a-entity id="textFrame" position="0 0 -5" rotation="0 25 0">
    <a-entity id="text" gltf-model="#model"></a-entity>
  </a-entity>
  <a-camera
    position="0 0 0"
    look-controls="enabled:true"
    wasd-controls="enabled:false">
  </a-camera>

</a-scene>

<script>

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      }
    });

    const video = document.getElementById("video");

    video.srcObject = stream;

    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    await video.play();

  } catch (err) {

    console.error(err);

  }

}

window.addEventListener("load", startCamera);

</script>


<div id="version" style="position:fixed;bottom:env(safe-area-inset-bottom, 0px);right:6px;color:#fff;background:#0009;font:10px monospace;z-index:10;padding:3px;pointer-events:none">AR v26</div>
<script>
(function () {
  const model = document.getElementById('text');
  const frame = document.getElementById('textFrame');
  const cameraEl = document.querySelector('a-camera');
  let bounds = null;
  function positionModel() {
    if (!bounds) return;
    const camera = cameraEl.getObject3D('camera');
    if (!camera || !camera.aspect) return;
    const depth = 5;
    const h = 2 * depth * Math.tan(THREE.MathUtils.degToRad(camera.fov || 80) / 2);
    const w = h * camera.aspect;
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());
    // The GLB is ~6.26 units wide and has two stacked text meshes.
    // Excessive uniform scaling caused severe perspective distortion.
    // Fit the word across the viewport, but independently enlarge letter height.
    const scaleX = w * 3.35 / Math.max(size.x, 0.00001);
    const scaleY = scaleX * 2.50;
    const scaleZ = scaleX * 0.78;
    model.object3D.scale.set(scaleX, scaleY, scaleZ);
    // Place the pivot at the leftmost edge (ENNO), not at the center.
    model.object3D.position.set(
      -bounds.min.x * scaleX,
      -center.y * scaleY,
      -center.z * scaleZ
    );
    frame.object3D.rotation.set(0, THREE.MathUtils.degToRad(25), 0);
    // Start ENNO just inside the left edge of the camera viewport.
    frame.object3D.position.x = -w * 0.47;
    // Anchor the actual lower edge at 96% of the initial camera view.
    frame.object3D.position.y = -h * 0.45 + size.y * scaleY / 2;
    frame.object3D.position.z = -depth;
  }
  model.addEventListener('model-loaded', function () {
    const mesh = model.getObject3D('mesh');
    if (!mesh) return;
    mesh.updateMatrixWorld(true);
    bounds = new THREE.Box3().setFromObject(mesh);
    positionModel();
  });
  document.querySelector('a-scene').addEventListener('renderstart', positionModel);
  window.addEventListener('resize', positionModel);
})();
</script>
</body>
</html>
