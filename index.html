<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ENNO HAAR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: #000;
}

#video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 0;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 1;
  background: transparent !important;
}
</style>
</head>

<body>

<video
  id="video"
  playsinline
  webkit-playsinline
  muted>
</video>

<a-scene
  embedded
  renderer="alpha:true; antialias:true; colorManagement:true"
  background="transparent:true"
  vr-mode-ui="enabled:false"
>

  <a-assets>
    <a-asset-item
      id="model"
      src="./enno6_test.glb">
    </a-asset-item>
  </a-assets>

  <a-entity
    light="type: ambient; intensity: 1.8">
  </a-entity>

  <a-entity
    light="type: directional; intensity: 1.2"
    position="1 2 1">
  </a-entity>

  <!-- The camera-attached frame gives predictable screen placement without image tracking. -->
  <a-camera id="camera" position="0 0 0"
    look-controls="enabled:true" wasd-controls="enabled:false">
    <a-entity id="textFrame" position="0 0 -5" rotation="0 -2 0">
      <a-entity id="text" gltf-model="#model"></a-entity>
    </a-entity>
  </a-camera>
</a-scene>

<script>

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      }
    });

    const video = document.getElementById("video");

    video.srcObject = stream;

    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    await video.play();

  } catch (err) {

    console.error(err);

  }

}

window.addEventListener("load", startCamera);

</script>

<script>
// Fit the actual GLB geometry to the camera viewport.
// This avoids the GLB's origin/pivot pushing the lettering out of view.
const textEl = document.getElementById("text");
const frameEl = document.getElementById("textFrame");
const cameraEl = document.getElementById("camera");
let modelSize = null;
let modelCenter = null;

function fitLettering() {
  if (!modelSize || !modelCenter) return;
  const camera = cameraEl.getObject3D("camera");
  const object = textEl.getObject3D("mesh");
  if (!camera || !object) return;

  const depth = 5;
  const fov = THREE.MathUtils.degToRad(camera.fov || 80);
  const visibleHeight = 2 * depth * Math.tan(fov / 2);
  const visibleWidth = visibleHeight * camera.aspect;

  // Fill most of the screen width, with a cap on letter height.
  const scale = Math.min(
    (visibleWidth * 0.94) / Math.max(modelSize.x, 0.00001),
    (visibleHeight * 0.34) / Math.max(modelSize.y, 0.00001)
  );

  textEl.object3D.scale.setScalar(scale);
  textEl.object3D.position.set(
    -modelCenter.x * scale,
    -modelCenter.y * scale,
    -modelCenter.z * scale
  );

  // Place the bottom edge around 95% down the screen.
  const renderedHeight = modelSize.y * scale;
  const centerY = -visibleHeight * 0.45 + renderedHeight / 2;
  frameEl.object3D.position.set(0, centerY, -depth);
}

textEl.addEventListener("model-loaded", () => {
  const object = textEl.getObject3D("mesh");
  if (!object) return;
  object.updateMatrixWorld(true);
  const bounds = new THREE.Box3().setFromObject(object);
  modelSize = bounds.getSize(new THREE.Vector3());
  modelCenter = bounds.getCenter(new THREE.Vector3());
  fitLettering();
});
window.addEventListener("resize", () => requestAnimationFrame(fitLettering));
document.querySelector("a-scene").addEventListener("renderstart", fitLettering);
</script>

</body>
</html>
