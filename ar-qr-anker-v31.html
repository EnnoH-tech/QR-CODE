<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ENNO HAAR · Marker AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
/* MindAR owns the canvas and camera-video layer. Do not override scene styles. */
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:black}
#status {position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:99999;pointer-events:none;text-align:center;color:white;font:14px/1.35 system-ui,-apple-system,sans-serif;}
#status span {display:inline-block;background:rgba(0,0,0,.70);padding:10px 15px;border-radius:12px}
#version {position:fixed;right:7px;top:max(7px,env(safe-area-inset-top));z-index:99999;color:#fff;background:#0009;padding:3px 5px;font:11px monospace}
</style>
</head>
<body>
<a-scene
 id="scene"
 mindar-image="imageTargetSrc: ./targets2.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes; filterMinCF: 0.001; filterBeta: 0.03;"
 color-space="sRGB"
 renderer="colorManagement: true; physicallyCorrectLights: true"
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false">
 <a-assets>
  <a-asset-item id="ennoModel" src="./enno6_test.glb"></a-asset-item>
 </a-assets>
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity light="type:ambient;intensity:0.28"></a-entity>
 <a-entity light="type:directional;intensity:2.8" position="-2 4 3"></a-entity>
 <a-entity id="anchor" mindar-image-target="targetIndex: 0">
  <a-entity id="frame" position="-0.40 -0.40 0.12" rotation="0 7 0">
   <a-entity id="text" gltf-model="#ennoModel"></a-entity>
  </a-entity>
 </a-entity>
</a-scene>
<div id="version">QR AR v4</div>
<div id="status"><span id="message">Kamerazugriff erlauben, danach QR-Code ins Bild halten</span></div>
<script>
(function() {
const scene=document.querySelector('#scene');
const anchor=document.querySelector('#anchor');
const model=document.querySelector('#text');
const message=document.querySelector('#message');
const show=s=>message.textContent=s;
anchor.addEventListener('targetFound',()=>show('QR-Code erkannt – Schrift folgt dem QR-Code'));
anchor.addEventListener('targetLost',()=>show('QR-Code ins Kamerabild halten'));
scene.addEventListener('arReady',()=>show('Kamera gestartet. QR-Code ins Kamerabild halten'));
scene.addEventListener('arError',e=>{console.error('AR start failure',e);show('AR konnte nicht starten. Bitte die Seite direkt in Safari öffnen.')});
model.addEventListener('model-error',e=>{console.error('GLB error',e);show('3D-Modell konnte nicht geladen werden.')});
let done=false;
model.addEventListener('model-loaded',()=>{
 if(done)return;
 const mesh=model.getObject3D('mesh');if(!mesh)return;
 done=true;
 mesh.updateMatrixWorld(true);
 const rootBox=new THREE.Box3().setFromObject(mesh);
 const rootInv=new THREE.Matrix4().copy(mesh.matrixWorld).invert();
 const localBox=rootBox.clone().applyMatrix4(rootInv);
 const startX=localBox.min.x+(localBox.max.x-localBox.min.x)*0.67;
 mesh.traverse(function(part){
  if(!part.isMesh||!part.geometry||!part.geometry.attributes.position)return;
  part.geometry=part.geometry.clone();
  const pos=part.geometry.attributes.position;
  const toRoot=new THREE.Matrix4().copy(mesh.matrixWorld).invert().multiply(part.matrixWorld);
  const fromRoot=new THREE.Matrix4().copy(part.matrixWorld).invert().multiply(mesh.matrixWorld);
  const p=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
   p.fromBufferAttribute(pos,i).applyMatrix4(toRoot);
   if(p.x>startX)p.x=startX+(p.x-startX)*1.30;
   p.applyMatrix4(fromRoot);
   pos.setXYZ(i,p.x,p.y,p.z);
  }
  pos.needsUpdate=true;
  part.geometry.computeBoundingBox();
  part.geometry.computeBoundingSphere();
  part.geometry.computeVertexNormals();
 });
 mesh.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(mesh);
 const size=bounds.getSize(new THREE.Vector3());
 const scaleX=2.4/Math.max(size.x,0.0001);
 model.object3D.scale.set(scaleX,scaleX*2.50,scaleX*0.78);
 model.object3D.position.set(-bounds.min.x*scaleX,-bounds.min.y*scaleX*2.50,-bounds.getCenter(new THREE.Vector3()).z*scaleX*0.78);
});
})();
</script>
</body>
</html>
